name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editor:
    name: Editor tests (CodeMirror)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Committed editor bundle matches the source
        run: npm run build && git diff --exit-code -- ../Resources/editor/editor.js

  app:
    name: Build and test (macOS, Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**/*.swift', 'Tests/**/*.swift') }}
          restore-keys: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
      - name: Install Tectonic (used by the SyncTeX integration test)
        run: brew install tectonic
      - name: Unit and integration tests
        run: swift test
      - name: Build Texora.app
        run: ./scripts/build-app.sh
      - name: Check the app bundle
        run: |
          test -x dist/Texora.app/Contents/MacOS/Texora
          test -f dist/Texora.app/Contents/Resources/editor/editor.js
          test -f dist/Texora.app/Contents/Resources/AppIcon.icns
          plutil -lint dist/Texora.app/Contents/Info.plist
          codesign --verify --deep --strict dist/Texora.app
          lipo -archs dist/Texora.app/Contents/MacOS/Texora | grep -q arm64
      - name: Package the DMG
        run: ./scripts/make-dmg.sh --skip-build
      - name: Check the DMG
        run: |
          DMG="$(ls dist/Texora-*.dmg)"
          hdiutil verify "$DMG"
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          codesign --verify --deep --strict "$MNT/Texora.app"
          test -L "$MNT/Applications"
          hdiutil detach "$MNT"
      - uses: actions/upload-artifact@v7
        with:
          name: Texora-dmg-${{ github.sha }}
          path: dist/Texora-*.dmg
          retention-days: 7
